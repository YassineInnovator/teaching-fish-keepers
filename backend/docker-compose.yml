services:
  db:
    image: postgres:17
    container_name: clubpoisson-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clubpoisson
      POSTGRES_USER: clubpoisson
      POSTGRES_PASSWORD: clubpoisson
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpoisson -d clubpoisson"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubpoisson-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PGHOST: db
      PGDATABASE: clubpoisson
      PGUSER: clubpoisson
      PGPASSWORD: clubpoisson
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: clubpoisson-frontend-placeholder
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
